<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo-7f0cd0bc.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Healeka HMS</title>
    <meta
      http-equiv="Permissions-Policy"
      content="identity-credentials-get=(), publickey-credentials-get=(), publickey-credentials-create=(), digital-credentials-get=(), otp-credentials=()"
    />
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, "") || "/";
        var isPublic =
          path.indexOf("/view/prescription/") === 0 ||
          path.indexOf("/view/report/") === 0 ||
          path === "/register-op";
        if (isPublic) document.documentElement.classList.add("public-patient");
      })();
    </script>
    <style>
      /* Boot loader while JS bundles load / React mounts */
      #root:empty {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f5f7fb;
        margin: 0;
      }
      #root:empty::before {
        content: "";
        width: 36px;
        height: 36px;
        border: 3px solid #e2e8f0;
        border-top-color: #233e82;
        border-radius: 50%;
        animation: hms-boot-spin 0.7s linear infinite;
      }
      #root:empty::after {
        content: "Loading…";
        font-family: Inter, system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #64748b;
      }
      @keyframes hms-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Full-screen overlay used before idle / manual reloads */
      #hms-reload-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f5f7fb;
        font-family: Inter, system-ui, sans-serif;
      }
      #hms-reload-overlay .hms-reload-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e2e8f0;
        border-top-color: #233e82;
        border-radius: 50%;
        animation: hms-boot-spin 0.7s linear infinite;
      }
      #hms-reload-overlay .hms-reload-label {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #64748b;
      }
      /* Boot watchdog fallback (shown only if React never mounts) */
      #hms-boot-help {
        position: fixed;
        inset: 0;
        z-index: 99998;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #f5f7fb;
        font-family: Inter, system-ui, sans-serif;
        padding: 24px;
        text-align: center;
      }
      #hms-boot-help .hms-boot-help-title {
        font-size: 15px;
        font-weight: 700;
        color: #0f172a;
      }
      #hms-boot-help .hms-boot-help-text {
        font-size: 13px;
        color: #64748b;
        max-width: 320px;
      }
      #hms-boot-help button {
        margin-top: 4px;
        border: 0;
        border-radius: 8px;
        background: #233e82;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        padding: 10px 22px;
        cursor: pointer;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      class="hms-material-icons"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        if (!document.documentElement.classList.contains("public-patient"))
          return;
        // Patients don't need Material icons — skip that font download on mobile.
        var iconLink = document.querySelector("link.hms-material-icons");
        if (iconLink) iconLink.remove();
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-8b0b1a77.js"></script>
  </head>
  <body>
    <div id="root"></div>
    
    <script>
      // Boot watchdog: if React hasn't mounted after 20s (bundle stalled or
      // failed after the tab sat idle / the device slept — network not back
      // yet, stale chunks after a deploy), don't leave the #root:empty
      // spinner up forever. Retry once automatically, then offer a manual
      // reload. Shares its retry guard with src/main.jsx.
      (function () {
        var BOOT_TIMEOUT_MS = 20000;
        function rootIsEmpty() {
          var root = document.getElementById("root");
          return !root || root.childElementCount === 0;
        }
        function showBootHelp() {
          if (document.getElementById("hms-boot-help") || !rootIsEmpty())
            return;
          var box = document.createElement("div");
          box.id = "hms-boot-help";
          box.innerHTML =
            '<div class="hms-boot-help-title">Taking longer than usual\u2026</div>' +
            '<div class="hms-boot-help-text">The connection may have dropped while this site was idle. Check your connection, then reload.</div>' +
            '<button type="button" onclick="window.location.reload()">Reload</button>';
          document.body.appendChild(box);
          var watcher = window.setInterval(function () {
            if (!rootIsEmpty()) {
              box.remove();
              window.clearInterval(watcher);
            }
          }, 1000);
        }
        window.setTimeout(function () {
          if (!rootIsEmpty()) return;
          try {
            var last = Number(
              sessionStorage.getItem("hms-boot-retry-at") || 0,
            );
            if (Date.now() - last > 60000) {
              sessionStorage.setItem(
                "hms-boot-retry-at",
                String(Date.now()),
              );
              window.location.reload();
              return;
            }
          } catch (e) {
            /* sessionStorage unavailable — fall through to the help panel */
          }
          showBootHelp();
        }, BOOT_TIMEOUT_MS);
      })();
    </script>
  </body>
</html>
