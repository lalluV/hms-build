<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo-7f0cd0bc.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Healeka HMS</title>
    <meta
      http-equiv="Permissions-Policy"
      content="identity-credentials-get=(), publickey-credentials-get=(), publickey-credentials-create=(), digital-credentials-get=(), otp-credentials=()"
    />
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, "") || "/";
        var isPublic =
          path.indexOf("/view/prescription/") === 0 ||
          path.indexOf("/view/report/") === 0 ||
          path === "/register-op";
        if (isPublic) document.documentElement.classList.add("public-patient");
      })();
    </script>
    <style>
      /* Boot loader while JS bundles load / React mounts */
      #root:empty {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f5f7fb;
        margin: 0;
      }
      #root:empty::before {
        content: "";
        width: 36px;
        height: 36px;
        border: 3px solid #e2e8f0;
        border-top-color: #233e82;
        border-radius: 50%;
        animation: hms-boot-spin 0.7s linear infinite;
      }
      #root:empty::after {
        content: "Loading…";
        font-family: Inter, system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #64748b;
      }
      @keyframes hms-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Full-screen overlay used before idle / manual reloads */
      #hms-reload-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f5f7fb;
        font-family: Inter, system-ui, sans-serif;
      }
      #hms-reload-overlay .hms-reload-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e2e8f0;
        border-top-color: #233e82;
        border-radius: 50%;
        animation: hms-boot-spin 0.7s linear infinite;
      }
      #hms-reload-overlay .hms-reload-label {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #64748b;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      class="hms-material-icons"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        if (!document.documentElement.classList.contains("public-patient"))
          return;
        // Patients don't need Material icons — skip that font download on mobile.
        var iconLink = document.querySelector("link.hms-material-icons");
        if (iconLink) iconLink.remove();
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-17981888.js"></script>
  </head>
  <body>
    <div id="root"></div>
    
  </body>
</html>
